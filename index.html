<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suivi Muscu</title>
<meta name="theme-color" content="#101215">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #101215; color: #e8e6e0;
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    padding: calc(20px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; min-height: 100vh;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; gap: 12px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a8f98; }
  .card { background: #1a1d22; border: 1px solid #2a2e35; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .date { font-weight: 700; font-size: 15px; text-transform: capitalize; color: #e8c15a; }
  .label-chip { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
                background: #22262c; border: 1px solid #2a2e35; color: #b9bdc4; margin-left: 8px; vertical-align: 2px; }
  .muted { color: #8a8f98; }
  .btn { background: #22262c; color: #e8e6e0; border: 1px solid #2a2e35; border-radius: 10px;
         padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-accent { background: #e8c15a; border-color: #e8c15a; color: #14161a; }
  .btn-wide { width: 100%; text-align: left; margin-bottom: 8px; padding: 12px 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab { background: none; border: none; color: #8a8f98; font-size: 14px; font-weight: 600;
         padding: 6px 2px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-on { color: #e8e6e0; border-bottom-color: #e8c15a; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; }
  ul.ex-list { list-style: none; display: flex; flex-direction: column; gap: 8px; padding: 0; }
  .ex-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
            border-bottom: 1px solid #22262c; padding-bottom: 8px; font-size: 15px; }
  .ex-nums { font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 7px; }
  .chip-up { background: rgba(95,184,106,0.15); color: #5fb86a; }
  .chip-down { background: rgba(214,69,51,0.15); color: #d64533; }
  .link { background: none; border: none; color: #8a8f98; font-size: 12px; cursor: pointer;
          text-decoration: underline; text-underline-offset: 2px; padding: 0; }
  .link-danger:active, .link-danger:hover { color: #d64533; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .pill { background: #1a1d22; border: 1px solid #2a2e35; color: #b9bdc4; border-radius: 999px;
          padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .pill-on { background: #e8c15a; border-color: #e8c15a; color: #14161a; font-weight: 700; }
  .stats { display: flex; gap: 12px; margin-bottom: 14px; }
  .stat { flex: 1; }
  .stat b { font-size: 22px; letter-spacing: -0.02em; display: block; }
  .overlay { position: fixed; inset: 0; background: rgba(8,9,11,0.75); display: flex;
             align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; margin-bottom: 0; }
  .input { background: #101215; border: 1px solid #2a2e35; border-radius: 8px; color: #e8e6e0;
           padding: 8px 10px; font-size: 16px; width: 100%; }
  .input:focus { outline: 2px solid #e8c15a55; border-color: #e8c15a; }
  .w-num { width: 66px; flex: none; text-align: center; }
  .w-rep { width: 46px; flex: none; text-align: center; padding: 8px 4px; }
  .ex-block { border: 1px solid #22262c; border-radius: 10px; padding: 10px; margin-bottom: 10px; background: #16181d; }
  .form-row { display: flex; gap: 6px; align-items: center; }
  .sets-row { display: flex; gap: 5px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .btn-mini { background: #22262c; color: #e8e6e0; border: 1px solid #2a2e35; border-radius: 8px;
              width: 32px; height: 36px; font-size: 16px; cursor: pointer; flex: none; }
  .hint { margin-top: 8px; font-size: 12px; color: #8a8f98; line-height: 1.5; }
  .hint b { color: #e8c15a; }
  .hidden { display: none; }
  canvas { max-width: 100%; }
  /* --- minuteur de repos --- */
  #timer-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    background: #e8c15a; color: #14161a; border: none; border-radius: 999px; min-width: 56px; height: 56px;
    font-size: 15px; font-weight: 800; cursor: pointer; z-index: 60; padding: 0 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  #timer-fab.running { background: #1a1d22; color: #e8c15a; border: 2px solid #e8c15a; }
  #timer-panel { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom));
    background: #1a1d22; border: 1px solid #2a2e35; border-radius: 14px; padding: 14px; z-index: 60;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 210px; }
  #timer-panel .eyebrow { margin-bottom: 8px; }
  .timer-presets { display: flex; gap: 6px; }
  .timer-presets .btn { flex: 1; padding: 9px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">Carnet d'entraînement</div>
    <h1>Suivi Muscu</h1>
  </div>
  <button class="btn btn-accent" onclick="openNewSession()">+ Nouvelle séance</button>
</header>

<nav class="tabs">
  <button id="tab-journal" class="tab tab-on" onclick="setView('journal')">Journal</button>
  <button id="tab-progression" class="tab" onclick="setView('progression')">Progression</button>
</nav>

<div id="view-journal"></div>

<div id="view-progression" class="hidden">
  <div class="pills" id="exo-pills"></div>
  <div class="card">
    <div class="stats" id="stats"></div>
    <canvas id="chart" height="240"></canvas>
    <p class="muted" id="volume-note" style="font-size:12px; margin-top:8px;"></p>
  </div>
</div>

<!-- choix du type de séance -->
<div id="chooser" class="overlay hidden">
  <div class="card modal">
    <div class="eyebrow" style="margin-bottom:12px;">Quelle séance aujourd'hui ?</div>
    <div id="chooser-list"></div>
    <button class="btn btn-wide" onclick="openBlank()">✚ &nbsp;Séance vierge (nouveau groupe)</button>
    <div style="display:flex; justify-content:flex-end; margin-top:10px;">
      <button class="btn" onclick="document.getElementById('chooser').classList.add('hidden')">Annuler</button>
    </div>
  </div>
</div>

<!-- formulaire séance -->
<div id="modal" class="overlay hidden">
  <div class="card modal">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px;">
      <input id="f-label" class="input" list="labels-dl" placeholder="Groupe (ex : Dos/Biceps)" style="flex:1;">
      <datalist id="labels-dl"></datalist>
      <input type="date" id="f-date" class="input" style="width:150px; flex:none;">
    </div>
    <div id="f-rows"></div>
    <button class="link" onclick="addBlock()" style="margin-top:6px;">+ Ajouter un exercice</button>
    <div style="display:flex; gap:10px; margin-top:18px; justify-content:flex-end;">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-accent" onclick="saveSession()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- minuteur de repos -->
<div id="timer-panel" class="hidden">
  <div class="eyebrow">Repos entre séries</div>
  <div class="timer-presets">
    <button class="btn" onclick="startTimer(90)">1:30</button>
    <button class="btn" onclick="startTimer(120)">2:00</button>
    <button class="btn" onclick="startTimer(180)">3:00</button>
  </div>
  <button class="btn" id="timer-stop" style="width:100%; margin-top:8px;" onclick="stopTimer()">Arrêter</button>
</div>
<button id="timer-fab" onclick="toggleTimerPanel()">⏱</button>

<script>
/* ---------------- données ---------------- */
const KEY = 'gym-sessions';
const SEED = [
  { id:'s1', date:'2026-07-12', label:'Dos/Biceps', exercises:[
    {name:'Lat pulldown', weight:35, reps:[10,10,10,10]},
    {name:'Seated row', weight:40, reps:[10,10,10,10]},
    {name:'Curl biceps', weight:10, reps:[10,10,10,10]},
    {name:'Curl prise marteau', weight:10, reps:[10,10,10,10]}]},
  { id:'s2', date:'2026-07-15', label:'Dos/Biceps', exercises:[
    {name:'Lat pulldown', weight:40, reps:[10,10,10,10]},
    {name:'Seated row', weight:45, reps:[10,10,10,10]},
    {name:'Curl biceps', weight:10, reps:[10,10,10,10]},
    {name:'Curl prise marteau', weight:12, reps:[10,10,10,10]}]},
];
const REP_TARGET = 12;      // palier de la double progression
const WEIGHT_STEP = 2.5;    // incrément de charge suggéré (kg)

let sessions = load();
let editingId = null;
let selectedExo = null;
let chart = null;

function migrate(list) {
  // ancien format : reps (nombre) + sets → nouveau : reps (tableau)
  for (const s of list) {
    if (s.label === undefined) s.label = '';
    for (const ex of s.exercises) {
      if (!Array.isArray(ex.reps)) {
        const n = Number(ex.sets) || 1;
        ex.reps = Array(n).fill(Number(ex.reps) || 0);
      }
      delete ex.sets;
    }
  }
  return list;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return migrate(raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED)));
  } catch { return migrate(JSON.parse(JSON.stringify(SEED))); }
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(sessions)); } catch(e){ console.error(e); } }

const norm = s => (s||'').trim().toLowerCase();
const sorted = () => [...sessions].sort((a,b) => a.date.localeCompare(b.date));
const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const fmtShort = iso => new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sum = a => a.reduce((x,y)=>x+y,0);

function repsLabel(reps) {
  if (!reps.length) return '';
  return reps.every(r => r === reps[0]) ? `${reps[0]} rép × ${reps.length}` : reps.join('-') + ' rép';
}
function computeDeltas() {
  const last = {}, map = {};
  for (const s of sorted()) for (const ex of s.exercises) {
    const k = norm(ex.name);
    if (last[k] !== undefined) map[s.id+'|'+k] = ex.weight - last[k];
    last[k] = ex.weight;
  }
  return map;
}
function exoNames() {
  const seen = {};
  for (const s of sorted()) for (const ex of s.exercises) {
    const k = norm(ex.name);
    if (k && !seen[k]) seen[k] = ex.name;
  }
  return Object.values(seen);
}
function labels() {
  const seen = {};
  for (const s of sorted()) {
    const k = norm(s.label);
    if (k) seen[k] = { label: s.label, date: s.date, session: s };
  }
  return Object.values(seen);
}
/* dernière performance sur un exercice (hors séance en cours d'édition) */
function lastPerf(name, excludeId) {
  const k = norm(name); let found = null;
  for (const s of sorted()) {
    if (s.id === excludeId) continue;
    const ex = s.exercises.find(e => norm(e.name) === k);
    if (ex) found = { date: s.date, ex };
  }
  return found;
}
function suggestionHTML(name, excludeId) {
  if (!norm(name)) return '';
  const p = lastPerf(name, excludeId);
  if (!p) return '<span>Premier passage sur cet exercice — note une charge qui te permet ' + (REP_TARGET-2) + ' rép propres.</span>';
  const minR = Math.min(...p.ex.reps);
  const target = (minR >= REP_TARGET)
    ? `passe à <b>${p.ex.weight + WEIGHT_STEP} kg</b> et redescends à 8-10 rép`
    : `vise <b>${minR + 1} rép</b> sur chaque série (palier : ${REP_TARGET})`;
  return `Dernière fois (${fmtShort(p.date)}) : <b>${p.ex.weight} kg</b> · ${repsLabel(p.ex.reps)} &nbsp;🎯 ${target}`;
}

/* ---------------- vues ---------------- */
function setView(v) {
  document.getElementById('view-journal').classList.toggle('hidden', v!=='journal');
  document.getElementById('view-progression').classList.toggle('hidden', v!=='progression');
  document.getElementById('tab-journal').classList.toggle('tab-on', v==='journal');
  document.getElementById('tab-progression').classList.toggle('tab-on', v==='progression');
  if (v==='progression') renderProgression();
}

function renderJournal() {
  const deltas = computeDeltas();
  const el = document.getElementById('view-journal');
  const list = sorted().reverse();
  if (!list.length) {
    el.innerHTML = '<div class="card" style="text-align:center;color:#8a8f98;">Aucune séance pour l\'instant. Ajoutez votre première séance !</div>';
    return;
  }
  el.innerHTML = list.map(s => `
    <div class="card">
      <div class="card-head">
        <span><span class="date">${fmtDate(s.date)}</span>${s.label ? `<span class="label-chip">${esc(s.label)}</span>` : ''}</span>
        <span style="display:flex;gap:10px;flex:none;">
          <button class="link" onclick="openEdit('${s.id}')">modifier</button>
          <button class="link link-danger" onclick="removeSession('${s.id}')">suppr.</button>
        </span>
      </div>
      <ul class="ex-list">
        ${s.exercises.map(ex => {
          const d = deltas[s.id+'|'+norm(ex.name)];
          const chip = (d !== undefined && d !== 0)
            ? `<span class="chip ${d>0?'chip-up':'chip-down'}">${d>0?'+':''}${d} kg</span>` : '';
          return `<li class="ex-row">
            <span>${esc(ex.name)}</span>
            <span class="ex-nums"><b>${ex.weight} kg</b><span class="muted">· ${repsLabel(ex.reps)}</span>${chip}</span>
          </li>`;
        }).join('')}
      </ul>
    </div>`).join('');
}

function renderProgression() {
  const names = exoNames();
  if (!selectedExo || !names.some(n => norm(n)===norm(selectedExo))) selectedExo = names[0] || null;
  document.getElementById('exo-pills').innerHTML = names.map(n =>
    `<button class="pill ${norm(n)===norm(selectedExo||'')?'pill-on':''}" onclick="selectExo('${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`
  ).join('');

  const k = norm(selectedExo || '');
  const data = sorted().map(s => {
    const ex = s.exercises.find(e => norm(e.name)===k);
    return ex ? { date: fmtShort(s.date), poids: ex.weight, volume: ex.weight * sum(ex.reps) } : null;
  }).filter(Boolean);

  const statsEl = document.getElementById('stats');
  const noteEl = document.getElementById('volume-note');
  if (!data.length) { statsEl.innerHTML=''; noteEl.textContent='Pas encore de données.'; if(chart){chart.destroy();chart=null;} return; }

  const first = data[0].poids, lastW = data[data.length-1].poids, diff = Math.round((lastW-first)*10)/10;
  statsEl.innerHTML = `
    <div class="stat"><div class="eyebrow" style="font-size:10px;">Départ</div><b>${first} kg</b></div>
    <div class="stat"><div class="eyebrow" style="font-size:10px;">Actuel</div><b style="color:#e8c15a;">${lastW} kg</b></div>
    <div class="stat"><div class="eyebrow" style="font-size:10px;">Progression</div><b style="color:${diff>0?'#5fb86a':diff<0?'#d64533':'#e8e6e0'};">${diff>=0?'+':''}${diff} kg</b></div>`;
  noteEl.innerHTML = `Poids soulevé par séance — volume total dernière séance : <b style="color:#e8e6e0;">${data[data.length-1].volume} kg</b> (poids × total des rép)`;

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: data.map(d => d.date),
      datasets: [{
        label: 'Poids (kg)', data: data.map(d => d.poids),
        borderColor: '#e8c15a', backgroundColor: '#e8c15a',
        borderWidth: 2.5, pointRadius: 4, tension: 0.3,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8f98' }, grid: { color: '#262a31' } },
        y: { ticks: { color: '#8a8f98' }, grid: { color: '#262a31' },
             suggestedMin: Math.min(...data.map(d=>d.poids)) - 5,
             suggestedMax: Math.max(...data.map(d=>d.poids)) + 5 },
      },
    },
  });
}
function selectExo(n) { selectedExo = n; renderProgression(); }

/* ---------------- nouvelle séance : choix du groupe ---------------- */
function openNewSession() {
  const ls = labels();
  if (!ls.length) return openBlank();
  document.getElementById('chooser-list').innerHTML = ls
    .sort((a,b) => a.date.localeCompare(b.date))
    .map((l,i) => `<button class="btn btn-wide" onclick="openFromLabel(${i})">
        <b>${esc(l.label)}</b><br><span class="muted" style="font-size:12px;">dernière fois : ${fmtDate(l.date)}</span>
      </button>`).join('');
  window._labelChoices = ls.sort((a,b) => a.date.localeCompare(b.date));
  document.getElementById('chooser').classList.remove('hidden');
}
function openFromLabel(i) {
  const l = window._labelChoices[i];
  document.getElementById('chooser').classList.add('hidden');
  openModal({
    id: 's' + Date.now(),
    date: new Date().toISOString().slice(0,10),
    label: l.label,
    exercises: l.session.exercises.map(e => ({ name: e.name, weight: e.weight, reps: [...e.reps] })),
  });
}
function openBlank() {
  document.getElementById('chooser').classList.add('hidden');
  openModal({
    id: 's' + Date.now(),
    date: new Date().toISOString().slice(0,10),
    label: '',
    exercises: [{name:'', weight:'', reps:[10,10,10,10]}],
  });
}
function openEdit(id) {
  const s = sessions.find(x => x.id===id);
  if (s) openModal({ ...s, exercises: s.exercises.map(e => ({ name: e.name, weight: e.weight, reps: [...e.reps] })) });
}

/* ---------------- formulaire ---------------- */
function repInputs(reps) {
  return reps.map(r => `<input class="input w-rep f-rep" type="number" inputmode="numeric" value="${r}">`).join('');
}
function blockHTML(ex, id) {
  return `<div class="ex-block" data-bid="${id}">
    <div class="form-row">
      <input class="input f-name" placeholder="Nom de l'exercice" value="${esc(ex.name||'')}"
             style="flex:1;min-width:0;" oninput="refreshHint(this)">
      <input class="input w-num f-weight" type="number" inputmode="decimal" step="0.5" value="${ex.weight ?? ''}" placeholder="kg">
      <button class="link link-danger" style="width:22px;flex:none;" onclick="this.closest('.ex-block').remove()">✕</button>
    </div>
    <div class="sets-row">
      <span class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;flex:none;">Rép/série</span>
      <span class="rep-wrap" style="display:contents;">${repInputs(ex.reps)}</span>
      <button class="btn-mini" onclick="addRep(this)">+</button>
      <button class="btn-mini" onclick="delRep(this)">−</button>
    </div>
    <div class="hint">${suggestionHTML(ex.name, editingId)}</div>
  </div>`;
}
let blockSeq = 0;
function openModal(session) {
  editingId = session.id;
  document.getElementById('f-date').value = session.date;
  document.getElementById('f-label').value = session.label || '';
  document.getElementById('labels-dl').innerHTML = labels().map(l => `<option value="${esc(l.label)}">`).join('');
  document.getElementById('f-rows').innerHTML = session.exercises.map(ex => blockHTML(ex, ++blockSeq)).join('');
  document.getElementById('modal').classList.remove('hidden');
}
function addBlock() {
  document.getElementById('f-rows').insertAdjacentHTML('beforeend',
    blockHTML({name:'', weight:'', reps:[10,10,10,10]}, ++blockSeq));
}
function addRep(btn) {
  const block = btn.closest('.ex-block');
  const reps = block.querySelectorAll('.f-rep');
  const lastVal = reps.length ? reps[reps.length-1].value : 10;
  btn.insertAdjacentHTML('beforebegin', `<input class="input w-rep f-rep" type="number" inputmode="numeric" value="${lastVal}">`);
}
function delRep(btn) {
  const reps = btn.closest('.ex-block').querySelectorAll('.f-rep');
  if (reps.length > 1) reps[reps.length-1].remove();
}
function refreshHint(nameInput) {
  const block = nameInput.closest('.ex-block');
  block.querySelector('.hint').innerHTML = suggestionHTML(nameInput.value, editingId);
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); editingId = null; }
function saveSession() {
  const blocks = [...document.querySelectorAll('#f-rows .ex-block')];
  const exercises = blocks.map(b => ({
    name: b.querySelector('.f-name').value.trim(),
    weight: Number(b.querySelector('.f-weight').value) || 0,
    reps: [...b.querySelectorAll('.f-rep')].map(i => Number(i.value) || 0),
  })).filter(e => e.name !== '');
  if (!exercises.length) return;
  const s = {
    id: editingId,
    date: document.getElementById('f-date').value,
    label: document.getElementById('f-label').value.trim(),
    exercises,
  };
  const idx = sessions.findIndex(x => x.id===editingId);
  if (idx >= 0) sessions[idx] = s; else sessions.push(s);
  persist(); closeModal(); renderJournal();
  if (!document.getElementById('view-progression').classList.contains('hidden')) renderProgression();
}
function removeSession(id) {
  if (!confirm('Supprimer cette séance ?')) return;
  sessions = sessions.filter(s => s.id!==id);
  persist(); renderJournal();
}

/* ---------------- minuteur de repos ---------------- */
let timerEnd = null, timerInt = null, audioCtx = null;
const fab = document.getElementById('timer-fab');
function toggleTimerPanel() {
  document.getElementById('timer-panel').classList.toggle('hidden');
}
function startTimer(sec) {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
  timerEnd = Date.now() + sec*1000;
  clearInterval(timerInt);
  timerInt = setInterval(tick, 250);
  document.getElementById('timer-panel').classList.add('hidden');
  fab.classList.add('running');
  tick();
}
function stopTimer() {
  clearInterval(timerInt); timerInt = null; timerEnd = null;
  fab.classList.remove('running'); fab.textContent = '⏱';
  document.getElementById('timer-panel').classList.add('hidden');
}
function tick() {
  const left = Math.ceil((timerEnd - Date.now())/1000);
  if (left <= 0) { fireAlarm(); stopTimer(); return; }
  const m = Math.floor(left/60), s = String(left%60).padStart(2,'0');
  fab.textContent = `${m}:${s}`;
}
function fireAlarm() {
  if (navigator.vibrate) navigator.vibrate([300,120,300,120,500]);
  if (audioCtx) {
    try {
      [0, 0.35, 0.7].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.4, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.3);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.3);
      });
    } catch {}
  }
  fab.textContent = 'GO !';
}

/* ---------------- init + PWA ---------------- */
persist(); // enregistre la migration éventuelle de l'ancien format
renderJournal();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
